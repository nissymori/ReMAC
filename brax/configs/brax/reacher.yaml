# tuned
sac:
  env: brax/reacher
  env_params:
    episode_length: 50
  agent_kwargs:
    activation: tanh
  num_envs: 128
  buffer_size: 1_000_000
  fill_buffer: 10_000
  batch_size: 512
  learning_rate: 0.0004617429169256732
  num_epochs: 128
  total_timesteps: 5242880
  eval_freq: 32768
  gamma: 0.95
  polyak: 0.99
  target_entropy_ratio: 0
  normalize_observations: true


remax_ac:
  env: brax/reacher
  # FIX: this block previously omitted env_params, so remax_ac silently used
  # Brax's default episode_length=1000 while sac/ppo used 50 -- a 20x longer
  # episode, which made the SAC-vs-ReMAC return comparison on Reacher invalid.
  env_params:
    episode_length: 50
  agent_kwargs:
    activation: tanh
  num_envs: 128
  buffer_size: 1_000_000
  fill_buffer: 10_000
  batch_size: 512
  learning_rate: 0.0003   # re-tuned for ReMAC after the episode_length fix (Tab. 2; was 5e-4)
  num_epochs: 128
  total_timesteps: 5242880
  eval_freq: 32768
  gamma: 0.95
  polyak: 0.99
  target_entropy_ratio: 0
  normalize_observations: true
  remax_num_samples: 16
  remax_m: 4
  actor_epsilon: 1e-8
  soft_critic: false  

# tuned
ppo:
  env: brax/reacher
  env_params:
    episode_length: 50
  agent_kwargs:
    activation: tanh
  num_envs: 128
  num_steps: 128
  num_epochs: 8
  num_minibatches: 64
  learning_rate: 0.00027520696850790545
  max_grad_norm: 0.1
  total_timesteps: 1048576
  eval_freq: 32768
  gamma: 0.95
  gae_lambda: 0.95
  clip_eps: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  normalize_observations: true
